# Runs on every push and pull request (see the "Actions" tab on GitHub).
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    # A throwaway MySQL server for the integration tests.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: quiz_db_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Unit tests, integration tests and WAR
        run: mvn -B verify -Dtest.db.password=root

  docker:
    name: Docker smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Start the app and the database
        run: docker compose up --detach --build --wait

      - name: Wait for Tomcat
        run: |
          for attempt in $(seq 1 30); do
            curl --silent --fail --output /dev/null http://localhost:8080/login && exit 0
            sleep 2
          done
          echo "The login page never answered" && exit 1

      - name: Log in as a demo user
        run: |
          cookies=$(mktemp)
          token=$(curl --silent --fail --cookie-jar "$cookies" http://localhost:8080/login \
            | grep --only-matching 'name="_csrf" value="[^"]*"' | head -n 1 | sed 's/.*value="//; s/"$//')
          curl --silent --fail --cookie "$cookies" --cookie-jar "$cookies" --output /dev/null \
            --data-urlencode "_csrf=$token" --data "username=alice" --data "password=password123" \
            http://localhost:8080/login
          curl --silent --fail --cookie "$cookies" http://localhost:8080/home | grep "Welcome back, Alice Johnson"

      - name: Show the logs if something failed
        if: failure()
        run: docker compose logs

      - name: Clean up
        if: always()
        run: docker compose down --volumes
